<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คิดถึงนะ</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffd1e3, #ffe9f1 50%, #d9e7ff);
    font-family: "Mali", "Noto Sans Thai", "Sarabun", "Leelawadee UI", Tahoma, sans-serif;
    color: #e0457b; overflow: hidden; text-align: center; user-select: none;
  }
  .bear { font-size: 110px; animation: bob 2s ease-in-out infinite; cursor: pointer; }
  @keyframes bob { 50% { transform: translateY(-14px) rotate(4deg); } }
  h1 { font-size: clamp(2.2rem, 9vw, 4.5rem); margin: 10px 0 4px; line-height: 1.4; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  p { margin: 0; font-size: 1.2rem; color: #b07a95; min-height: 1.6em; line-height: 1.6; }
  .heart { position: fixed; bottom: -40px; animation: float linear forwards; pointer-events: none; }
  @keyframes float { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
</style>
</head>
<body>
  <div class="bear" id="bear">🧸</div>
  <h1>คิดถึงนะ 💕</h1>
  <p id="msg">(แตะที่น้องหมีดูสิ)</p>

<script>
  const lines = [
    "คิดถึงเท่านี้เลย 🤏🤏🤏🤏🤏🤏🤏🤏",
    "คิดถึงมากกว่ากาแฟอีกนะ ☕",
    "กลับมาหาหน่อยน้าา 🥺",
    "ส่งกอดไปให้ตรงนี้เลย 🫂",
    "เธอคือคนโปรดของเราเลยนะ 💖",
    "ตอนนี้คิดถึงมากกว่าเดิมอีก 😭"
  ];
  let i = 0;
  function heart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💕","💗","💓","🌸"][Math.floor(Math.random()*5)];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 30 + "px";
    h.style.animationDuration = 3 + Math.random() * 3 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
  }
  setInterval(heart, 350);
  document.getElementById("bear").addEventListener("click", () => {
    document.getElementById("msg").textContent = lines[i++ % lines.length];
    for (let n = 0; n < 12; n++) setTimeout(heart, n * 40);
  });
</script>
</body>
</html>
